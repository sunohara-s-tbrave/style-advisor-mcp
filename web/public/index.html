<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Style Advisor</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3.2a1.3 1.3 0 1 1 1.3 1.3" />
          <path d="M12 4.5V7" />
          <path d="M12 7 3.4 12.9a1 1 0 0 0 .57 1.83h16.06a1 1 0 0 0 .57-1.83Z" />
          <path d="M4.5 17.3h15" />
        </svg>
      </span>
      <span class="brand-name">Style Advisor</span>
    </div>
    <span class="badge">ローカル版</span>
  </header>

  <div class="scroll-area">
    <main>
      <section id="empty-state" class="empty-state">
        <span class="empty-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3.2a1.3 1.3 0 1 1 1.3 1.3" />
            <path d="M12 4.5V7" />
            <path d="M12 7 3.4 12.9a1 1 0 0 0 .57 1.83h16.06a1 1 0 0 0 .57-1.83Z" />
            <path d="M4.5 17.3h15" />
          </svg>
        </span>
        <h1>今日は何を着ましょうか？</h1>
        <p class="hint">
          骨格タイプやパーソナルカラー、コーデ選びまで。
          あなたのPC上の Claude が、専門資料を見ながら一緒に考えます。
        </p>
        <div class="suggestions" id="suggestions">
          <button type="button" class="suggestion-chip" data-prompt="自分の骨格タイプを診断してほしい">
            <span class="chip-index">01</span>
            <span class="chip-text">骨格タイプを診断してほしい</span>
          </button>
          <button type="button" class="suggestion-chip" data-prompt="似合うパーソナルカラーを教えて">
            <span class="chip-index">02</span>
            <span class="chip-text">似合う色が知りたい</span>
          </button>
          <button type="button" class="suggestion-chip" data-prompt="オフィスカジュアルのコーディネートを提案して">
            <span class="chip-index">03</span>
            <span class="chip-text">オフィスカジュアルの相談</span>
          </button>
          <button type="button" class="suggestion-chip" data-prompt="持っている服に合わせる小物を知りたい">
            <span class="chip-index">04</span>
            <span class="chip-text">合わせる小物を知りたい</span>
          </button>
        </div>
      </section>

      <div id="log" class="log" aria-live="polite"></div>
    </main>
  </div>

  <footer class="composer">
    <div id="attachment-preview" class="attachment-preview" hidden>
      <img id="attachment-thumb" alt="添付画像のプレビュー" />
      <button type="button" id="attachment-remove" aria-label="画像を削除">×</button>
    </div>
    <form id="ask-form">
      <input type="file" id="image-input" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
      <button type="button" id="attach-button" aria-label="写真を添付して診断">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8a2 2 0 0 1 2-2h1.2l.9-1.5A1.5 1.5 0 0 1 9.4 3.7h5.2a1.5 1.5 0 0 1 1.3.8L16.8 6H18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z" />
          <circle cx="12" cy="13" r="3.2" />
        </svg>
      </button>
      <textarea
        id="message"
        rows="1"
        placeholder="メッセージを入力（Enterで送信 / Shift+Enterで改行）"
        autocomplete="off"
      ></textarea>
      <button type="submit">
        <span class="label">送信</span>
      </button>
    </form>
  </footer>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
